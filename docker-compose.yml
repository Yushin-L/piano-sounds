# 개발용 APK 다운로드 페이지: http://<서버 IP>:8765/
# 새 APK는 dist/ 와 scripts/serve_apk.py 를 갱신한 뒤 `docker compose restart` 로 반영한다.
services:
  piano-sounds-apk:
    image: python:3.12-slim
    container_name: piano-sounds-apk
    command: ["python", "/app/scripts/serve_apk.py", "--bind", "0.0.0.0", "--port", "8765"]
    ports:
      - "8765:8765"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./dist:/app/dist:ro
    restart: unless-stopped
