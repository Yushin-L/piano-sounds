name: Android checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Test metronome timing and mixing
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp app/src/test/cpp/MetronomeTest.cpp -o /tmp/piano-metronome-test
          /tmp/piano-metronome-test
      - name: Test master limiter and chord rendering
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp app/src/test/cpp/LimiterTest.cpp -o /tmp/piano-limiter-test
          /tmp/piano-limiter-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/test/cpp/host -Iapp/src/main/cpp \
            app/src/test/cpp/ChordRender.cpp app/src/main/cpp/PianoSynth.cpp -o /tmp/piano-chord-render
          /tmp/piano-chord-render "" 70 && /tmp/piano-chord-render "" 100
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: piano-sounds-debug
          path: app/build/outputs/apk/debug/app-debug.apk
